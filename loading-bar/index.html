
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading · Forma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="m-0">

    <div class="w-full min-h-screen flex flex-col items-center justify-center gap-[20px] bg-[#190B10]">

      <div class="text-[#C4A2AB] text-[10px]">
        — LET’S GET YOU STARTED —
      </div>

      <div class="w-[720px] h-[456px] rounded-[24px] flex flex-col overflow-hidden bg-[#260F17]">

        <!-- Main content -->
        <div class="w-full flex-1 p-[40px]">

          <div class="w-[624px] h-[28px] flex justify-between">
            <p class="text-[#FF9299] text-[10px]">
              GETTING READY
            </p>

            <p class="text-[#C4A2AB] text-[11px]">
              01 — 03
            </p>
          </div>

          <div class="text-[#FFF5EE] text-[40px] mb-[12px]">
            Something good is coming.
          </div>

          <div class="text-[#C4A2AB] text-[15px]">
            A little preparation for a great beginning.
          </div>

          <div class="w-[624px] h-[112px] flex items-center justify-between mb-6">

            <div class="w-[177px] h-[136px] flex items-baseline gap-[8px]">

              <!-- Percentage counter -->
              <p id="counter" class="text-[#FFF5EE] text-[112px]">
                0
              </p>

              <p class="text-[#FF6470] text-[38px]">
                %
              </p>

            </div>

            <!-- Loading message -->
            <p id="message" class="text-[#C4A2AB] text-[14px]">
              Preparing your space
            </p>

          </div>

          <!-- Progress bar -->
          <div class="w-[624px] h-[12px] rounded-[6px] bg-[#46232E] mb-[14px] overflow-hidden">

            <div
              id="loading-bar"
              class="w-0 h-[12px] rounded-[6px] bg-[#EF3340]"
            ></div>

          </div>

          <div class="w-[624px] h-[16px] flex justify-between">

            <div class="text-[#C4A2AB] text-[10px]">
              PREPARING YOUR EXPERIENCE
            </div>

            <div class="text-[#C4A2AB] text-[10px]">
              JUST A MOMENT
            </div>

          </div>

        </div>

        <!-- Bottom section -->
        <div class="w-full h-[56px] shrink-0 flex items-center justify-center bg-[#1E0C13]">

          <div class="text-[#C4A2AB] text-[12px]">
            → Your welcome page will open automatically.
          </div>

        </div>

      </div>

    </div>

  </body>
</html>
