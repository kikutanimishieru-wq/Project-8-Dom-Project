<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#101b16] font-sans text-[#f0fdf4]"
  >
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#86efac]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#86efac]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#86efac] transition-colors hover:border-[#86efac]/35 hover:bg-[#86efac]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#86efac] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>

        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#86efac]/65"
          >The everyday collection / 02</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="w-[520px] h-[571px] rounded-[24px] flex-col justify-center overflow-hidden bg-[#192B22]"
        >
            
        <div class="w-[44px] h-[44px] rounded-[12px] bg-[#4ADE8026] mt-[36px] ml-[36px] flex items-center justify-center">
          <svg
            width="23"
            height="23"
            viewBox="0 0 23 23"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7.66602 9.58325H15.3327C16.9205 9.58325 18.2077 10.8704 18.2077 12.4583V17.2499C18.2077 18.8377 16.9205 20.1249 15.3327 20.1249H7.66602C6.0782 20.1249 4.79102 18.8377 4.79102 17.2499V12.4583C4.79102 10.8704 6.0782 9.58325 7.66602 9.58325Z"
              stroke-width="1.62917"
              stroke-linecap="round"
              stroke="#86EFAC"
            />
            <path
              d="M7.66602 9.58333V6.70833C7.66602 5.69167 8.06988 4.71665 8.78877 3.99776C9.50766 3.27887 10.4827 2.875 11.4993 2.875C12.516 2.875 13.491 3.27887 14.2099 3.99776C14.9288 4.71665 15.3327 5.69167 15.3327 6.70833V9.58333M11.4993 14.375V16.2917"
              stroke-width="1.62917"
              stroke-linecap="round"
              stroke="#86EFAC"
            />
          </svg>
        </div>


          <p class="text-[#F0FDF4] text-[28px] ml-[36px] mt-[24px]">
            Password generator
          </p>
          <p class="text-[#A4B9AD] text-[14px] ml-[36px] mt-[8px]">
            A strong password. One click away.
          </p>
          <p class="text-[#A4B9AD] text-[12px] ml-[36px] mt-[32px]">
            Your password
          </p>

          <div
            class="w-[448px] h-[64px] rounded-[12px] bg-[#101B16] flex justify-between items-center ml-[36px] mt-[12px]"
          >
            <p id="show-generated-password" class="text-[#BBF7D0] text-[18px] ml-[16px]">K9#mQ2&xR7!vN4@p</p>

            <div
              class="w-[55px] h-[31px] rounded-[8px] bg-[#FFFFFF0D] mr-[12px] flex items-center justify-center"
            >
              <p id="copy-generated-password" class="text-[#DCECE2] text-[12px]">Copy</p>
            </div>
          </div>

          <p id="message"  class="text-[#A4B9AD] text-[12px] ml-[36px] mt-[12px]">
            Uses letters, numbers, and symbols.
          </p>

          <div
            class="w-[448px] h-[28px] ml-[36px] mt-[29.5px] flex justify-between items-center"
          >
            <p class="text-[#DCECE2] text-[14px]">Password length</p>
            <p id="password-length-output" class="text-[#86EFAC] text-[18px]">16</p>
          </div>

       
        <div class="w-[448px] ml-[36px] mt-[23px] flex items-center">
          <input 
            type="range"
            name="passwordLength"
            id="password-length-range-input"
            min="8"
            max="24"
            value="16"
            class="w-full h-[6px] rounded-[3px] accent-[#4ADE80] cursor-pointer"
          />
        </div>


          <div
            class="w-[448px] h-[16px] mt-[4.5px] ml-[36px] flex justify-between items-center"
          >
            <p class="text-[#86EFAC] text-[12px]">8</p>
            <p class="text-[#86EFAC] text-[12px]">24</p>
          </div>

          <div id="generate-password"
            class="w-[448px] h-[48px] rounded-[12px] bg-[#4ADE80] ml-[36px] mt-[28px] flex items-center justify-center"
          >
            <p class="text-[#102418] text-[14px]">Generate password</p>
          </div>

          <div
            class="text-[#8AA294] text-[12px] mt-[20.5px] flex justify-center"
          >
            Generated in your browser. Never saved.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
