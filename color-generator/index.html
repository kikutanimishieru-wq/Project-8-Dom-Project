<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]"
  >
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <!-- Header -->
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10"
      >
        <a
          href="../index.html"
          class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5]"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5m7-7-7 7 7 7" />
          </svg>
          Back to projects
        </a>

        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65"
        >
          The everyday collection / 03
        </span>
      </header>

      <!-- Title and Shuffle -->
      <div class="mt-[40px] flex h-[104px] items-start justify-between">
        <div class="flex flex-col gap-[8px]">
          <p class="text-[30px] text-[#F4F4F5]">Color palettes.</p>
          <p class="text-[14px] text-[#A1A1AA]">
            Generated shades with Tailwind color names. Click a shade to copy
            its HEX background color.
          </p>
        </div>

        <button
          id="shuffle-colors"
          type="button"
          class="flex h-[48px] w-[186px] items-center justify-center gap-[8px] rounded-[12px] bg-[#D9F99D] text-[14px] text-[#09090B]"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M13.3327 4.66675V8.00008H9.99935M2.66602 11.3334V8.00008H5.99935"
              stroke="currentColor"
              stroke-width="1.33333"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M4.06602 4.66667C4.43591 3.99398 4.96604 3.42292 5.60943 3.00412C6.25282 2.58532 6.98959 2.33172 7.75444 2.26578C8.51929 2.19985 9.2886 2.32362 9.99417 2.62613C10.6997 2.92864 11.3198 3.40054 11.7993 4.00001L13.3327 8.00001M2.66602 8.00001L4.19935 12C4.67891 12.5995 5.29896 13.0714 6.00453 13.3739C6.7101 13.6764 7.4794 13.8002 8.24425 13.7342C9.0091 13.6683 9.74587 13.4147 10.3893 12.9959C11.0327 12.5771 11.5628 12.006 11.9327 11.3333"
              stroke="currentColor"
              stroke-width="1.33333"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Shuffle palettes
        </button>
      </div>

      <!-- Divider -->
      <div class="h-px w-full bg-[#27272A]"></div>

      <!-- Information -->
      <div class="mt-[20px] flex h-[55px] justify-between">
        <p class="text-[12px] text-[#A1A1AA]">100 → 950 · LIGHT TO DARK</p>
        <p id="status" class="text-[12px] text-[#A1A1AA]">Ready to explore.</p>
      </div>

      <!-- Color Palette -->
      <main class="flex flex-col gap-[28px]">
        <section>
          <p class="mb-[12px] text-[14px] text-[#E4E4E7]">Red</p>

          <div id="colors" class="w-[1240px] h-[107px] gap-[8px]">
               <div class="flex w-[113.2px] flex-col gap-[8px]">
            <div class="h-[64px] w-full rounded-[12px] bg-[#FDE3E3]"></div>

            <div class="flex flex-col items-center justify-center">
              <p class="text-[12px] text-[#A1A1AA]">100</p>
              <p class="text-[12px] text-[#A1A1AA]">#FDE3E3</p>
            </div>
          </div>
          </div>
         
        </section>
      </main>
    </div>
  </body>
</html>
